<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caleb Hayes | 1st Birthday & Dedication</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         LOADING / ENTRY SCREEN
    ====================================================== -->

  <div id="loadingScreen" class="loading-screen">

    <div class="loading-decor decor-top"></div>
    <div class="loading-decor decor-bottom"></div>

    <div class="loading-content">

        <div class="loading-ornament">
            <span></span>
            <i>✦</i>
            <span></span>
        </div>

        <div class="loading-small">
            A SPECIAL INVITATION
        </div>

        <div class="loading-name">
            Caleb Hayes
        </div>

        <div class="loading-subtitle">
            First Birthday &amp; Dedication
        </div>

        <div class="loading-line"></div>

        <div class="loading-status" id="loadingStatus">
            Preparing your invitation...
        </div>

        <div class="loading-bar">
            <div id="loadingProgress" class="loading-progress"></div>
        </div>

        <div id="viewInvitationWrapper" class="view-invitation-wrapper">

            <button
                id="viewInvitationBtn"
                class="view-invitation-btn"
                type="button">

                <span>VIEW INVITATION</span>

                <span class="view-arrow">
                    ↓
                </span>

            </button>

        </div>

    </div>

</div>

<!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="color-background"></div>

    <div class="bubble-field" aria-hidden="true">
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
    </div>

    <video
        class="bg-video"
        id="bgVideo"
        preload="auto"
        muted
        loop
        playsinline>

        <source
            src="./backgroundVideo.mp4"
            type="video/mp4">

        Your browser does not support the video background.

    </video>

    <div class="ocean-overlay"></div>
    <div class="ocean-glow"></div>


    <!-- =====================================================
         BACKGROUND MUSIC
    ====================================================== -->

    <audio
        id="bgMusic"
        loop
        preload="auto">

        <source
            src="./music.mp4"
            type="audio/mpeg">

    </audio>


    <!-- =====================================================
         MUSIC BUTTON
    ====================================================== -->




    <!-- =====================================================
         MAIN INVITATION
    ====================================================== -->

    <main class="invitation">

        <!-- =================================================
             HERO
        ================================================== -->

        <section class="hero reveal">

            <div class="eyebrow cinematic eyebrow-reveal">
                YOU ARE INVITED TO
            </div>

            <div class="small-line cinematic line-reveal"></div>

            <p class="celebration-intro cinematic intro-reveal">
                A Day of Love & Blessings
            </p>

            <h1 class="cinematic-name">
                Caleb Hayes
            </h1>

            <div class="name-underline cinematic underline-reveal"></div>

            <p class="celebration-label cinematic label-reveal">
                AS HE CELEBRATES HIS
            </p>

            <h2 class="cinematic-title">
                <span style="font-family: 'Arial', sans-serif;">1st</span> Birthday
                <span>&</span>
                Dedication
            </h2>

            <p class="hosted cinematic hosted-reveal">

                Carried by waves of love, hosted by

                <br>

                <strong>
                    Mommy Lyne &amp; Daddy Shean
                </strong>

            </p>

            <div
                class="scroll-indicator cinematic scroll-reveal"
                aria-label="Scroll down">

                <!-- <span class="scroll-arrow">

                    <small>
                        scroll down
                    </small>

                    ↓

                </span> -->

            </div>


    <script src="script.js"></script>

</body>

</html>
